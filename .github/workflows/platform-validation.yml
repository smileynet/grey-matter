name: Manual platform validation

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DO_NOT_TRACK: '1'

jobs:
  windows-regressions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Original Windows failures
        run: node --test scripts/relocate-knowledge.test.mjs scripts/uninstall-crew-research.test.mjs

  full-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned tkt check dependency
        run: cargo install --git https://github.com/smileynet/tkt --rev 64c651cda08556f1fd6b2a5ed29a4a7b3d72c7f9 --locked
      - name: Complete repository gate
        run: node scripts/check-repo.mjs --require-tools
