<rect x="28" y="80" width="304" height="106" rx="12" fill="#162540" stroke="#27395a"/><text x="44" y="108" fill="#e8eef9" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Day 1: Ridge loop</text><text x="44" y="130" fill="#a3b3cf" font-family="system-ui,sans-serif" font-size="13">8.2 km · about 3 hours</text><text x="44" y="172" fill="#56d4f0" font-family="system-ui,sans-serif" font-size="13">High 18° · Low 7°</text><text x="250" y="172" fill="#a3b3cf" font-family="system-ui,sans-serif" font-size="13">Rain 10%</text><rect x="28" y="198" width="304" height="132" rx="12" fill="#162540" stroke="#27395a"/><text x="44" y="226" fill="#e8eef9" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Day 2: Lake and back</text><text x="44" y="248" fill="#a3b3cf" font-family="system-ui,sans-serif" font-size="13">11.5 km · about 4.5 hours</text><text x="44" y="274" fill="#56d4f0" font-family="system-ui,sans-serif" font-size="13">High 14° · Low 4°</text><text x="250" y="274" fill="#a3b3cf" font-family="system-ui,sans-serif" font-size="13">Rain 70%</text><rect x="44" y="292" width="272" height="26" rx="8" fill="#3b2f12"/><text x="54" y="310" fill="#ffc857" font-family="system-ui,sans-serif" font-size="12.5">Rain likely: pack a waterproof layer</text><rect x="28" y="342" width="304" height="106" rx="12" fill="#162540" stroke="#27395a"/><text x="44" y="370" fill="#e8eef9" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Day 3: Summit</text><text x="44" y="392" fill="#a3b3cf" font-family="system-ui,sans-serif" font-size="13">6.0 km · about 3 hours</text><text x="44" y="434" fill="#56d4f0" font-family="system-ui,sans-serif" font-size="13">High 11° · Low 1°</text><text x="250" y="434" fill="#a3b3cf" font-family="system-ui,sans-serif" font-size="13">Rain 20%</text>
